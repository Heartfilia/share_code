# 速享 · Nginx 站点配置
# 放置位置：/etc/nginx/conf.d/share.conf
# 生效命令：sudo nginx -t && sudo systemctl reload nginx
#
# 限流：按客户端 IP 限制「生成分享」的频率，防止有人脚本刷接口写满磁盘。
# rate=10r/m 即每 IP 平均每 6 秒允许 1 次创建；burst=5 容忍瞬间连点。
# zone 声明必须放在 http 层级，conf.d 的文件被 include 进 http{}，写在这里正好。
limit_req_zone $binary_remote_addr zone=share_api:10m rate=10r/m;
#
# 使用顺序：
#   1. 先用这份配置，让域名能通过 HTTP 访问
#   2. 再运行：sudo certbot --nginx -d share.example.com
#      certbot 会自动改写本文件，补上 443 监听与 HTTPS 跳转，并自动续期
#   3. 若证书已手动备好，直接把下面的 ssl 段落注释解开即可

server {
    listen      80;
    listen      [::]:80;
    server_name share.example.com;

    # 应用自身单条分享上限是 10MB，这里留出余量。
    # 不调大（Nginx 默认 1MB）的话，贴大段内容会被 Nginx 直接返回 413，
    # 根本到不了应用层，用户也就看不到应用给出的提示文案。
    client_max_body_size 12m;

    access_log /var/log/nginx/share.access.log;
    error_log  /var/log/nginx/share.error.log;

    # 只限流写盘的创建接口，浏览 /s/、读取 /source/ 不受影响
    location = /api/share {
        limit_req zone=share_api burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # ★ 关键配置：不转发原始 Host 的话，Node 看到的是 127.0.0.1:3000，
        #   生成的分享链接就会变成 http://127.0.0.1:3000/s/xxx，发给别人打不开。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}

